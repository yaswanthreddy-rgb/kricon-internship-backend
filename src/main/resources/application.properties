spring.application.name=interviewace

server.port=8080

# H2 file database kept in your home folder (outside OneDrive) so accounts survive restarts.
spring.datasource.url=jdbc:h2:file:${user.home}/.interviewace/interviewace;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set the JWT_SECRET environment variable in any real deployment; the fallback below is dev-only.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-you-deploy-this-anywhere}
app.jwt.expiration-ms=86400000

# Allow the Vite dev server to call this API
app.cors.allowed-origin=http://localhost:5173

# Social login settings
app.frontend.url=http://localhost:5173
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=http://localhost:8080/api/auth/google/callback
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.oauth.github.redirect-uri=http://localhost:8080/api/auth/github/callback
