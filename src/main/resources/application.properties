spring.application.name=interviewace

server.port=8080

# H2 in-memory DB so this runs immediately with no external setup.
# Swap these 4 lines for MySQL/Postgres when you're ready to persist data for real.
spring.datasource.url=jdbc:h2:mem:interviewace;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CHANGE THIS before deploying anywhere real — this is a dev-only placeholder secret.
app.jwt.secret=change-this-to-a-long-random-secret-before-you-deploy-this-anywhere
app.jwt.expiration-ms=86400000

# Allow the Vite dev server to call this API
app.cors.allowed-origin=http://localhost:5173
